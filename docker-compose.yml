# Zera o banco (volta aos dados de teste): "docker compose down -v"

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./db/banco_f1.sql:/docker-entrypoint-initdb.d/banco_f1.sql
      - dados_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 20

  app:
    image: python:3.12
    working_dir: /app
    volumes:
      - .:/app        
    ports:
      - "5000:5000"
    command: sh -c "pip install -r requirements.txt && flask --app app run --host 0.0.0.0 --debug"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados_mysql:
